# Tests: Smoketest (Syntax, Bundle-Integrität, Inline-Handler, Config-Konsistenz)
# plus alle Suiten aus tests/ (Workflow-Logik, Konzepte, Filter/Suche, SharePoint-Mapping …).
# Läuft bei jedem Push (außer dem Bot-Commit des Cache-Busters) und bei Pull Requests.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoketest + Testsuiten ausführen
        run: node scripts/test.mjs
