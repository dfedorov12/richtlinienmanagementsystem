# Tests: Smoketest (Syntax, Bundle-Integrität, Inline-Handler, Config-Konsistenz)
# plus alle Suiten aus tests/ (Workflow-Logik, Konzepte, Filter/Suche, SharePoint-Mapping …).
# Läuft bei jedem Push (außer dem Bot-Commit des Cache-Busters) und bei Pull Requests.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# Nur lesen: Der Lauf braucht keine Schreibrechte am Repository.
permissions:
  contents: read

jobs:
  tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 – auf den Commit festgelegt, ein verschobenes Tag kann nichts einschleusen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20
      - name: Smoketest + Testsuiten ausführen
        run: node scripts/test.mjs

      # Typprüfung: tsc liest das gewöhnliche JavaScript und meldet, was ein
      # Prüfer ohne Typen sehen kann – falsche Argumentzahl, Tippfehler in
      # Namen, Syntax in JSDoc. Ausgeliefert wird nichts; --noEmit.
      - name: TypeScript holen (nur für die Prüfung)
        run: npm install --no-save --no-audit --no-fund typescript@5

      - name: Typprüfung
        run: node scripts/typpruefung.mjs
