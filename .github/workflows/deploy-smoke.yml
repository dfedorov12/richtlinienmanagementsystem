# Deployment-Smoke: prüft das LIVE-System (read-only) per HTTP.
# Läuft täglich und manuell – fängt kaputte Deploys / 404-Assets / toten Redirect,
# auch ohne dass jemand pusht.
name: Deploy-Smoke

on:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC
  workflow_dispatch: {}

# Nur lesen: Der Lauf braucht keine Schreibrechte am Repository.
permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 – auf den Commit festgelegt, ein verschobenes Tag kann nichts einschleusen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20
      - name: Live-Deployment prüfen
        run: node scripts/deploy-smoke.mjs
